/* ── MediaWiki API via fetch with CORS + 429 backoff ── */
async function mwApi(params,retries=4){
  const qs=Object.entries(params).map(([k,v])=>`${k}=${encodeURIComponent(v)}`).join('&');
  const url=`https://${LANG}.wikipedia.org/w/api.php?${qs}&format=json&origin=*`;
  for(let i=0;i<=retries;i++){
    try{
      const r=await fetch(url);
      if(r.status===429){const wait=Math.min(2000*(i+1),10000);console.warn(`mwApi 429, waiting ${wait}ms (attempt ${i+1}/${retries+1})`);await new Promise(w=>setTimeout(w,wait));continue}
      if(!r.ok)throw new Error(`API ${r.status}`);
      return await r.json();
    }catch(e){if(i<retries){await new Promise(w=>setTimeout(w,1500*(i+1)));continue}throw e}
  }
  throw new Error('API rate limited after retries');
}

function extractOriginalUrl(archiveUrl, wikitext) {
  try {
    const u = new URL(archiveUrl), p = u.pathname + u.search;
    const m = p.match(/\/((?:\d{8,14}\/)?)(https?:\/\/.+)/);
    if (m && m[2]) return m[2];
  } catch(e) {}

  if (!wikitext) {
      return null;
  }

  const blockInfo = extractCitationBlock(wikitext, archiveUrl);
  if (!blockInfo || !blockInfo.text) {
      return null;
  }

  const urlRegex = /\|\s*url\s*=\s*(https?:\/\/[^[\]|{}\s<>"]+)/i;
  const match = urlRegex.exec(blockInfo.text);
  
  if (!match || !match[1]) {
      return null;
  }

  if (match[1].match(/archive\.(today|is|ph|fo|li|vn|md)/i) || match[1].match(/web\.archive\.org/i)) {
      return null;
  }

  return match[1];
}

async function checkWayback(o,retries=3){
  for(let attempt=0;attempt<=retries;attempt++){
    try{
      const r=await fetch(`https://archive.org/wayback/available?url=${encodeURIComponent(o)}`);
      if(r.status===503&&attempt<retries){await new Promise(w=>setTimeout(w,1000*(attempt+1)));continue}
      if(!r.ok)return null;
      const d=await r.json();
      return d.archived_snapshots?.closest?.available?d.archived_snapshots.closest.url:null;
    }catch{if(attempt<retries){await new Promise(w=>setTimeout(w,1000*(attempt+1)));continue}return null}
  }
  return null;
}

/* ── Smart Citation Extractor (State Machine) ── */
function extractCitationBlock(wikitext, targetUrl) {
  const idx = wikitext.indexOf(targetUrl);
  if (idx === -1) return { start: -1, end: -1, text: null };

  let startIdx = idx;
  let foundStart = false;
  while (startIdx >= 0 && (idx - startIdx) < 1500) {
    if (wikitext.substring(startIdx, startIdx + 2) === '{{') {
      const prefix = wikitext.substring(startIdx, startIdx + 12).toLowerCase();
      if (prefix.includes('cite') || prefix.includes('vcite') || prefix.includes('citation') || prefix.includes('webbref')) {
         foundStart = true;
         break;
      }
    }
    startIdx--;
  }
  if (!foundStart) return { start: -1, end: -1, text: null };

  let depth = 0;
  let endIdx = startIdx;
  const staticLimit = 4000;

  while (endIdx < wikitext.length) {
     if (endIdx - startIdx > staticLimit) return { start: -1, end: -1, text: null };
     if (wikitext.substring(endIdx, endIdx + 2) === '\n\n' || wikitext.substring(endIdx, endIdx + 3) === '\n==') {
         return { start: -1, end: -1, text: null };
     }
     
     if (wikitext.substring(endIdx, endIdx + 2) === '{{') {
         depth++;
         if (depth > 10) return { start: -1, end: -1, text: null };
         endIdx += 2;
         continue;
     }
     if (wikitext.substring(endIdx, endIdx + 2) === '}}') {
         depth--;
         endIdx += 2;
         if (depth === 0) {
             return { start: startIdx, end: endIdx, text: wikitext.substring(startIdx, endIdx) };
         }
         continue;
     }
     endIdx++;
  }
  return { start: -1, end: -1, text: null };
}

/* ── Extract date from Wayback URL ── */
function extractWaybackDate(waybackUrl){
  if(!waybackUrl)return null;
  const m=waybackUrl.match(/\/web\/(\d{4})(\d{2})(\d{2})\d*/);
  if(!m)return null;
  return `${m[1]}-${m[2]}-${m[3]}`;
}


/* ── Mass Edit Logic (Hidden POST Form) ── */
const escapeRegExp = (str) => str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

async function executeMassEdit(title, originalWikitext, selectedLinks) {
  let newText = originalWikitext;
  let replacedCount = 0;
  let replacements = [];

  selectedLinks.forEach(link => {
    if (link.archiveUrl && link.waybackUrl) {
      const blockInfo = extractCitationBlock(newText, link.archiveUrl);

      if (blockInfo.text && blockInfo.text.includes(link.archiveUrl)) {
        let updatedBlock = blockInfo.text;
        updatedBlock = updatedBlock.split(link.archiveUrl).join(link.waybackUrl);

        if (link.waybackDate) {
          const dateRegex = /(\|\s*(?:archive-?date|arkivdatum)\s*=)[^|}]*/i;

          if (dateRegex.test(updatedBlock)) {
            updatedBlock = updatedBlock.replace(dateRegex, `$1 ${link.waybackDate}`);
          } else {
            const afterArchiveUrl = /(\|\s*(?:archive-?url|arkivurl)\s*=[^|}]*)/i;
            if (afterArchiveUrl.test(updatedBlock)) {
              updatedBlock = updatedBlock.replace(
                afterArchiveUrl,
                `$1 |arkivdatum=${link.waybackDate}`
              );
            }
          }
        }

        replacements.push({
          start: blockInfo.start,
          end: blockInfo.end,
          updatedBlock,
          archiveUrl: link.archiveUrl
        });
      }
    }
  });

  replacements.sort((a, b) => b.start - a.start);

  replacements.forEach(rep => {
    newText =
      newText.substring(0, rep.start) +
      rep.updatedBlock +
      newText.substring(rep.end);
    replacedCount++;
  });

  selectedLinks.forEach(link => {
    if (link.archiveUrl && link.waybackUrl) {
      const wasReplaced = replacements.some(r => r.archiveUrl === link.archiveUrl);
      if (!wasReplaced && newText.includes(link.archiveUrl)) {
        const before = newText;
        newText = newText.split(link.archiveUrl).join(link.waybackUrl);
        if (newText !== before) {
          replacedCount++;
          if (link.waybackDate) {
            const dateRegex = /(\|\s*(?:archive-?date|arkivdatum)\s*=)[^|}]*/i;
            if (!dateRegex.test(newText)) {
              const afterArchiveUrl = /(\|\s*(?:archive-?url|arkivurl)\s*=[^|}]*)/i;
              if (afterArchiveUrl.test(newText)) {
                newText = newText.replace(
                  afterArchiveUrl,
                  `$1 |arkivdatum=${link.waybackDate}`
                );
              }
            }
          }
        }
      }
    }
  });

  if (replacedCount === 0 || newText === originalWikitext) {
    alert("Inga ändringar kunde utföras. Artikeln kan ha redigerats sedan skanningen. Prova att skanna om.");
    return;
  }

  let editToken = "+\\";
  try {
    const tokenData = await mwApi({ action: 'query', meta: 'tokens', type: 'csrf' });
    if (tokenData.query?.tokens?.csrftoken) {
      editToken = tokenData.query.tokens.csrftoken;
    }
  } catch (e) {
    console.warn("Could not fetch fresh edit token, falling back:", e);
  }

  const summary = `Ersätter ${replacedCount} archive.today-länk${replacedCount > 1 ? 'ar' : ''} med Wayback Machine-alternativ per [[Wikipedia:Arkivering]] (via [[Wikipedia:Länkdetektor|Länkdetektor]] / [https://swedish-archive-today-detector.toolforge.org/ verktyg])`;

  const form = document.createElement('form');
  form.method = 'POST';
  form.action = `https://sv.wikipedia.org/w/index.php?title=${encodeURIComponent(title)}&action=submit`;
  form.target = '_blank';

  const tbInput = document.createElement('input');
  tbInput.type = 'hidden';
  tbInput.name = 'wpTextbox1';
  tbInput.value = newText;
  form.appendChild(tbInput);

  const summaryInput = document.createElement('input');
  summaryInput.type = 'hidden';
  summaryInput.name = 'wpSummary';
  summaryInput.value = summary;
  form.appendChild(summaryInput);

  const diffInput = document.createElement('input');
  diffInput.type = 'hidden';
  diffInput.name = 'wpDiff';
  diffInput.value = 'Visa ändringar';
  form.appendChild(diffInput);

  const ultimateInput = document.createElement('input');
  ultimateInput.type = 'hidden';
  ultimateInput.name = 'wpUltimateParam';
  ultimateInput.value = '1';
  form.appendChild(ultimateInput);

  const tokenInput = document.createElement('input');
  tokenInput.type = 'hidden';
  tokenInput.name = 'wpEditToken';
  tokenInput.value = editToken;
  form.appendChild(tokenInput);

  document.body.appendChild(form);
  form.submit();
  document.body.removeChild(form);
}

/* ── Fetch top viewed pages from Wikimedia Pageviews API ── */
async function fetchTopPages(year, month) {
  const mm = String(month).padStart(2, '0');
  const url = `https://wikimedia.org/api/rest_v1/metrics/pageviews/top/sv.wikipedia/all-access/${year}/${mm}/all-days`;

  const response = await fetch(url);

  if (!response.ok) {
    throw new Error(response.status===404?`Data för denna månad är inte tillgänglig än. Pageviews API har endast slutförda månader — prova en tidigare månad.`:`Pageviews API returnerade ${response.status}`);
  }

  const data = await response.json();
  const articles = data.items?.[0]?.articles || [];

  const skipPrefixes = [
    'Huvudsida', 'Special:', 'Wikipedia:', 'Hjälp:',
    'Portal:', 'Fil:', 'Mall:', 'Kategori:', 'Diskussion:',
    'Användare:', 'MediaWiki:', 'Utkast:', 'Modul:'
  ];

  return articles
    .filter(a => !skipPrefixes.some(prefix => a.article.startsWith(prefix)))
    .filter(a => !a.article.startsWith('-'))
    .map(a => ({
      title: a.article.replace(/_/g, ' '),
      views: a.views
    }));
}

/* ── Autocomplete Input ── */
function AutocompleteInput({placeholder,value,onChange,onGo,loading,onStop,searchFn,displayFn}){
  const[suggestions,setSuggestions]=useState([]);
  const[showDrop,setShowDrop]=useState(false);
  const[activeIdx,setActiveIdx]=useState(-1);
  const debounceRef=useRef(null);
  const wrapRef=useRef(null);

  useEffect(()=>{
    if(debounceRef.current)clearTimeout(debounceRef.current);
    if(!value||value.length<2){setSuggestions([]);return}
    debounceRef.current=setTimeout(async()=>{
      const results=await searchFn(value);
      setSuggestions(results);setShowDrop(results.length>0);setActiveIdx(-1);
    },500);
    return()=>{if(debounceRef.current)clearTimeout(debounceRef.current)};
  },[value]);

  useEffect(()=>{
    const handler=e=>{if(wrapRef.current&&!wrapRef.current.contains(e.target))setShowDrop(false)};
    document.addEventListener("mousedown",handler);return()=>document.removeEventListener("mousedown",handler);
  },[]);

  const selectItem=(item)=>{onChange(displayFn?displayFn(item):item);setShowDrop(false);setSuggestions([])};
  const handleKey=(e)=>{
    if(!showDrop||!suggestions.length){if(e.key==="Enter"&&!loading)onGo();return}
    if(e.key==="ArrowDown"){e.preventDefault();setActiveIdx(p=>Math.min(p+1,suggestions.length-1))}
    else if(e.key==="ArrowUp"){e.preventDefault();setActiveIdx(p=>Math.max(p-1,0))}
    else if(e.key==="Enter"){e.preventDefault();if(activeIdx>=0)selectItem(suggestions[activeIdx]);else{setShowDrop(false);if(!loading)onGo()}}
    else if(e.key==="Escape")setShowDrop(false);
  };

  return(
    <div style={{display:"flex",gap:10,marginBottom:16,flexWrap:"wrap"}} ref={wrapRef}>
      <div style={{flex:1,minWidth:220,position:"relative"}}>
        <input type="text" value={value} onChange={e=>{onChange(e.target.value);setShowDrop(true)}} onKeyDown={handleKey}
          onFocus={()=>{if(suggestions.length)setShowDrop(true)}}
          placeholder={placeholder}
          style={{width:"100%",padding:"12px 16px",borderRadius:C.radiusSm,border:`1px solid ${C.cardBorder}`,background:C.card,color:C.text,fontSize:14,fontFamily:C.sans,boxShadow:C.shadow}}/>
        {showDrop&&suggestions.length>0&&(
          <div style={{position:"absolute",top:"100%",left:0,right:0,zIndex:100,marginTop:4,background:C.card,border:`1px solid ${C.cardBorder}`,borderRadius:C.radiusSm,boxShadow:C.shadowMd,maxHeight:320,overflowY:"auto"}}>
            {suggestions.map((item,idx)=>{
              const label=displayFn?displayFn(item):item;
              return(
                <div key={label} onClick={()=>selectItem(item)}
                  onMouseEnter={()=>setActiveIdx(idx)}
                  style={{
                    padding:"10px 16px",cursor:"pointer",fontSize:13,fontFamily:C.sans,
                    color:idx===activeIdx?C.accent:C.text,
                    background:idx===activeIdx?C.accentSoft:"transparent",
                    borderBottom:idx<suggestions.length-1?`1px solid ${C.bgAlt}`:"none",
                  }}>
                  {label}
                </div>
              );
            })}
          </div>
        )}
      </div>
      <button onClick={loading?onStop:onGo} disabled={!value.trim()&&!loading}
        onMouseEnter={e=>{if(!loading)e.currentTarget.style.background=C.btnDarkHover}}
        onMouseLeave={e=>{if(!loading)e.currentTarget.style.background=C.btnDark}}
        style={{padding:"12px 28px",borderRadius:C.radiusSm,border:"none",background:loading?C.red:C.btnDark,color:"#FAF9F5",fontSize:14,fontWeight:600,cursor:"pointer",fontFamily:C.sans,opacity:(!value.trim()&&!loading)?0.35:1,boxShadow:C.shadow,alignSelf:"flex-start"}}>
        {loading?"Stoppa":"Skanna"}
      </button>
    </div>
  );
}

/* ── Scan Engine ── */
function useScanEngine(){
  const[results,setResults]=useState([]);const[loading,setLoading]=useState(false);const[progress,setProgress]=useState("");const[error,setError]=useState("");const[done,setDone]=useState(false);const abort=useRef(false);const affectedCount=useRef(0);
  const reset=()=>{setResults([]);setError("");setDone(false);setProgress("");affectedCount.current=0};
  const scanArticles=useCallback(async(titles,{append=false}={})=>{
    setLoading(true);setError("");if(!append){setResults([]);affectedCount.current=0}setDone(false);if(!append)abort.current=false;
    let newHits=0;
    try{
      setProgress(`Hämtar wikitext för ${titles.length} artiklar…`);
      const wikitexts=await fetchWikitextBatch(titles);
      for(let ti=0;ti<titles.length;ti++){if(abort.current)break;const title=titles[ti];setProgress(`Skannar ${append?"(utökad) ":""}${ti+1} av ${titles.length}: ${title}`);
      const wikitext=wikitexts[title];if(!wikitext){setResults(p=>[...p,{title,links:[],error:"Inget innehåll hittades"}]);continue}
      const matches=[...new Set((wikitext.match(AT_RE)||[]).map(u=>u.replace(/[\]|}<>]+$/,"")))];
      const links=matches.map(url=>({archiveUrl:url,originalUrl:extractOriginalUrl(url, wikitext),waybackUrl:null,waybackDate:null,status:"pending"}));
      if(links.length>0){newHits++;affectedCount.current++}
      const artResult={title,wikitext,links:[...links]};setResults(p=>[...p,artResult]);
      for(let li=0;li<links.length;li++){if(abort.current)break;const lk=links[li];
        if(lk.originalUrl){setProgress(`Skannar ${append?"(utökad) ":""}${ti+1} av ${titles.length}: ${title} — Wayback (${li+1}/${links.length})`);const wb=await checkWayback(lk.originalUrl);lk.waybackUrl=wb;lk.waybackDate=extractWaybackDate(wb);lk.status=wb?"found":"notfound"}else{lk.status="noextract"}
        setResults(p=>{const u=[...p];const idx=u.findIndex(r=>r.title===title);if(idx!==-1)u[idx]={...artResult,links:[...links]};return u});await new Promise(r=>setTimeout(r,300))}
      links.forEach(l=>{if(l.status==="pending")l.status="noextract"});
      setResults(p=>{const u=[...p];const idx=u.findIndex(r=>r.title===title);if(idx!==-1)u[idx]={...artResult,links:[...links]};return u})
    }}catch(e){setError(e.message)}finally{setLoading(false);setDone(true);setProgress("")}
    return{newHits,totalAffected:affectedCount.current};
  },[]);
  return{results,loading,progress,error,done,scanArticles,stop:()=>{abort.current=true},reset,affectedCount};
}

/* ── Results View ── */
function ResultsView({results,done,showOnlyAffected=false}){
  const[filter,setFilter]=useState("all");
  const[linkStates,setLinkStates]=useState({});
  
  if(!results.length&&done)return<div style={{textAlign:"center",color:C.muted,padding:48,fontSize:14}}>Inga resultat hittades.</div>;
  if(!results.length)return null;
  const affected=results.filter(r=>r.links.length>0),clean=results.filter(r=>r.links.length===0);
  const totalLinks=results.reduce((s,r)=>s+r.links.length,0);
  const withAlts=results.reduce((s,r)=>s+r.links.filter(l=>l.waybackUrl).length,0);
  const noAlts=results.reduce((s,r)=>s+r.links.filter(l=>l.status==="notfound").length,0);
  const pending=results.reduce((s,r)=>s+r.links.filter(l=>l.status==="pending").length,0);

  const fixable = affected.filter(r => r.links.some(l => l.waybackUrl));
  const unfixable = affected.filter(r => !r.links.some(l => l.waybackUrl));

  const fixableSorted = [...fixable].sort((a, b) => {
    const aAlts = a.links.filter(l => l.waybackUrl).length;
    const bAlts = b.links.filter(l => l.waybackUrl).length;
    return bAlts - aAlts;
  });

  let display;
  if (showOnlyAffected) {
    if (filter === "fixable") display = fixableSorted;
    else if (filter === "unfixable") display = unfixable;
    else if (filter === "clean") display = clean;
    else display = [...fixableSorted, ...unfixable];
  } else {
    if (filter === "affected") display = [...fixableSorted, ...unfixable];
    else if (filter === "clean") display = clean;
    else display = [...fixableSorted, ...unfixable, ...clean];
  }

  const handleVerifyClick=(id)=>{
    setLinkStates(p=>{
      const current = p[id] || { stage: 0 };
      const nextStage = current.stage === 3 ? 0 : 3;
      return {...p, [id]: {...current, stage: nextStage}};
    });
  };

  return(
    <div style={{animation:"_fadeIn .3s ease"}}>
      {withAlts>0&&(
        <div style={{background:C.blueSoft,border:`1px solid ${C.blueBorder}`,borderRadius:C.radius,padding:"16px 20px",marginBottom:16}}>
          <div style={{fontWeight:700,marginBottom:8,display:"flex",alignItems:"center",gap:6,fontSize:13,color:C.blue}}><EditIcon/> Hur man åtgärdar artiklar (Assisterad granskning)</div>
          <div style={{color:C.textSec,fontSize:12,lineHeight:1.8}}>
            <strong>1.</strong> Klicka på de gröna <strong>Wayback Machine</strong>-länkarna för att verifiera ögonblicksbilden.<br/>
            <strong>2.</strong> Klicka på knappen <strong>Verifierad?</strong> bredvid varje länk för att markera den som klar.<br/>
            <strong>3.</strong> Klicka <strong style={{color:C.accent}}>Skicka verifierade arkiv till Wikipedia</strong> för att öppna redigeraren med dina verifierade ändringar förifyllda.
          </div>
        </div>
      )}

      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit, minmax(110px, 1fr))",gap:10,marginBottom:24}}>
        <Stat value={results.length} label="Skannade" variant="muted"/><Stat value={affected.length} label="Berörda" variant="red"/>
        <Stat value={totalLinks} label="AT-länkar" variant="amber"/><Stat value={withAlts} label="Alternativ" variant="green"/>
        <Stat value={noAlts} label="Inget alt" variant="red"/>{pending>0&&<Stat value={pending} label="Väntande" variant="amber"/>}
      </div>

      <div style={{display:"flex",gap:6,marginBottom:18,flexWrap:"wrap"}}>
        {showOnlyAffected ? (
          <React.Fragment>
            <button onClick={()=>setFilter("all")} style={{padding:"6px 16px",borderRadius:"999px",border:`1px solid ${filter==="all"?C.accent:C.cardBorder}`,cursor:"pointer",fontSize:12,fontWeight:600,fontFamily:C.sans,background:filter==="all"?C.accentSoft:C.card,color:filter==="all"?C.accent:C.muted}}>
              Alla berörda ({affected.length})
            </button>
            {fixable.length > 0 && (
              <button onClick={()=>setFilter("fixable")} style={{padding:"6px 16px",borderRadius:"999px",border:`1px solid ${filter==="fixable"?C.green:C.cardBorder}`,cursor:"pointer",fontSize:12,fontWeight:600,fontFamily:C.sans,background:filter==="fixable"?"rgba(46,125,91,0.08)":C.card,color:filter==="fixable"?C.green:C.muted}}>
                ✓ Åtgärdbara ({fixable.length})
              </button>
            )}
            {unfixable.length > 0 && (
              <button onClick={()=>setFilter("unfixable")} style={{padding:"6px 16px",borderRadius:"999px",border:`1px solid ${filter==="unfixable"?C.red:C.cardBorder}`,cursor:"pointer",fontSize:12,fontWeight:600,fontFamily:C.sans,background:filter==="unfixable"?C.redSoft:C.card,color:filter==="unfixable"?C.red:C.muted}}>
                ✗ Inget alternativ ({unfixable.length})
              </button>
            )}
            <button onClick={()=>setFilter("clean")} style={{padding:"6px 16px",borderRadius:"999px",border:`1px solid ${filter==="clean"?C.accent:C.cardBorder}`,cursor:"pointer",fontSize:12,fontWeight:600,fontFamily:C.sans,background:filter==="clean"?C.accentSoft:C.card,color:filter==="clean"?C.accent:C.muted}}>
              Rena ({clean.length})
            </button>
          </React.Fragment>
        ) : (
          [{v:"all",l:`Alla (${results.length})`},{v:"affected",l:`Berörda (${affected.length})`},{v:"clean",l:`Rena (${clean.length})`}].map(f=>
            <button key={f.v} onClick={()=>setFilter(f.v)} style={{padding:"6px 16px",borderRadius:"999px",border:`1px solid ${filter===f.v?C.accent:C.cardBorder}`,cursor:"pointer",fontSize:12,fontWeight:600,fontFamily:C.sans,background:filter===f.v?C.accentSoft:C.card,color:filter===f.v?C.accent:C.muted}}>{f.l}</button>
          )
        )}
      </div>

      {display.map((art,i)=>(
        <div key={art.title+i} style={{background:C.card,borderRadius:C.radius,padding:"20px 22px",marginBottom:14,border:`1px solid ${C.cardBorder}`,boxShadow:C.shadow,animation:"_fadeIn .25s ease"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
            <a href={`https://sv.wikipedia.org/wiki/${encodeURIComponent(art.title)}`} target="_blank" rel="noopener noreferrer"
              style={{color:C.text,textDecoration:"none",fontSize:15,fontWeight:600}}
              onMouseEnter={e=>e.currentTarget.style.color=C.accent} onMouseLeave={e=>e.currentTarget.style.color=C.text}>
              {art.title}
            </a>
            <div style={{display:"flex",gap:6,flexWrap:"wrap",alignItems:"center"}}>
              {art.error?(<Pill variant="red">API‑fel: {art.error}</Pill>):art.links.length>0?(<React.Fragment><Pill variant="red">{art.links.length} archive.today</Pill>{art.links.filter(l=>l.waybackUrl).length>0&&<Pill variant="green">{art.links.filter(l=>l.waybackUrl).length} alt{art.links.filter(l=>l.waybackUrl).length>1?"er":""}</Pill>}</React.Fragment>):(<Pill variant="green">Ren</Pill>)}
            </div>
          </div>

          {art.links.filter(l=>l.waybackUrl).length>0&&(
            <div style={{marginTop:12,display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
              <button onClick={()=>{
                const linksToFix = art.links.filter(l => {
                    const id = `${art.title}|${l.archiveUrl}`;
                    return l.waybackUrl && linkStates[id]?.stage === 3;
                }).map(l => {
                    const id = `${art.title}|${l.archiveUrl}`;
                    const st = linkStates[id] || {};
                    return {
                        ...l,
                        waybackUrl: st.customUrl || l.waybackUrl,
                        waybackDate: st.customUrl ? st.customDate : l.waybackDate
                    };
                });
                executeMassEdit(art.title, art.wikitext, linksToFix);
              }}
                onMouseEnter={e=>e.currentTarget.style.background=C.accentHover} onMouseLeave={e=>e.currentTarget.style.background=C.accent}
                style={{display:"inline-flex",alignItems:"center",gap:6,padding:"8px 16px",borderRadius:C.radiusSm,border:"none",background:C.accent,color:"#fff",fontSize:13,fontWeight:600,cursor:"pointer",fontFamily:C.sans,boxShadow:C.shadow}}>
                <EditIcon/> Skicka verifierade arkiv till Wikipedia
              </button>
              <span style={{fontSize:11,color:C.mutedLight}}>Öppnar redigeraren med förifyllda korrigeringar.</span>
            </div>
          )}

          {art.links.length>0&&(
            <div style={{marginTop:14}}>
              {art.links.map((lk,li)=>{
                const id=`${art.title}|${lk.archiveUrl}`;
                const lState = linkStates[id]||{stage:0};
                const displayUrl = lState.customUrl || lk.waybackUrl;
                const displayDate = lState.customUrl ? lState.customDate : lk.waybackDate;
                const isVerified = lState.stage === 3;

                return(
                <div key={li} style={{background:C.bgAlt,borderRadius:C.radiusSm,padding:"14px 16px",marginBottom:8,borderLeft:`3px solid ${lk.waybackUrl?C.green:lk.status==="pending"?C.amber:C.red}`}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:6}}>
                    <div style={{flex:1,minWidth:0,display:"flex",gap:12,alignItems:"flex-start"}}>
                      {lk.waybackUrl && (
                        <div style={{marginTop: 4}}>
                          <button 
                            title="Klicka för att markera som verifierad."
                            onClick={()=>handleVerifyClick(id)}
                            style={{
                              padding: "8px 14px",
                              borderRadius: "6px",
                              fontWeight: "bold",
                              fontSize: "12px",
                              cursor: "pointer",
                              border: "none",
                              transition: "all 0.1s ease",
                              background: isVerified ? C.green : C.card,
                              color: isVerified ? "#fff" : C.textSec,
                              boxShadow: C.shadow
                            }}>
                            {isVerified ? "Verifierad ✓" : "Verifierad?"}
                          </button>
                        </div>
                      )}
                      <div>
                        <div style={{fontSize:10,color:C.muted,fontFamily:C.mono,marginBottom:4,textTransform:"uppercase",letterSpacing:"0.04em",fontWeight:500}}>Archive.today länk #{li+1}</div>
                        <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                          <a href={lk.archiveUrl} target="_blank" rel="noopener noreferrer" style={{color:C.red,fontSize:12,wordBreak:"break-all",fontFamily:C.mono,fontWeight:500, textDecoration: isVerified ? "line-through" : "none"}}>{lk.archiveUrl}</a>
                          <CopyButton text={lk.archiveUrl} label="Kopiera gammal URL"/>
                        </div>
                        {lk.originalUrl&&(<div style={{marginTop:6}}><span style={{color:C.mutedLight,fontSize:10,fontFamily:C.mono}}>Original → </span><a href={lk.originalUrl} target="_blank" rel="noopener noreferrer" style={{color:C.muted,fontSize:11,wordBreak:"break-all",fontFamily:C.mono}}>{lk.originalUrl}</a></div>)}
                      </div>
                    </div>
                    {lk.status==="pending"?<Pill variant="amber">Väntande</Pill>:lk.status==="found"?<Pill variant="green">Alternativ funnet</Pill>:lk.status==="notfound"?<Pill variant="red">Inget alternativ</Pill>:<Pill variant="muted">Kan inte extrahera</Pill>}
                  </div>
                  {lk.waybackUrl&&(
                    <div style={{marginTop:10,padding:"10px 14px",background:C.greenSoft,borderRadius:C.radiusSm,border:`1px solid ${C.greenBorder}`,opacity:isVerified?0.75:1,transition:"opacity 0.2s"}}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:6}}>
                        <div style={{flex:1,minWidth:0}}>
                          <div style={{fontSize:10,color:C.green,fontWeight:600,marginBottom:4,textTransform:"uppercase",letterSpacing:"0.04em"}}>
                            Wayback Machine-alternativ
                            {!lState.editMode && !isVerified && (
                                <span onClick={()=>setLinkStates(p=>({...p, [id]: {...p[id], editMode:true, editValue: lState.customUrl || lk.waybackUrl}}))} style={{cursor:"pointer", marginLeft:8, fontSize:10, color:C.accent, textTransform:"none"}}>✏️ Redigera</span>
                            )}
                          </div>
                          
                          {lState.editMode ? (
                             <div style={{display:"flex", gap:6, marginTop:4, alignItems:"center"}}>
                               <input 
                                 type="text" 
                                 value={lState.editValue !== undefined ? lState.editValue : displayUrl} 
                                 onChange={e => {
                                   const val = e.target.value;
                                   setLinkStates(p => ({ ...p, [id]: { ...p[id], editValue: val } }));
                                 }} 
                                 style={{flex:1, padding:"4px 8px", fontSize:12, borderRadius:4, border:`1px solid ${C.greenBorder}`}} 
                               />
                               <button onClick={()=>{
                                  const val = (lState.editValue !== undefined ? lState.editValue : displayUrl).trim();
                                  let newDate = null;
                                  const dMatch = val.match(/\/web\/(\d{14})/);
                                  if(dMatch) {
                                      const d = dMatch[1];
                                      newDate = `${d.substring(0,4)}-${d.substring(4,6)}-${d.substring(6,8)}`;
                                  }
                                  setLinkStates(p=>({...p, [id]: {...p[id], editMode:false, customUrl:val, customDate:newDate}}));
                              }} style={{padding:"4px 8px", background:C.accent, color:"#fff", border:"none", borderRadius:4, cursor:"pointer", fontSize:11, fontWeight:"bold"}}>Spara</button>
                               <button onClick={()=>setLinkStates(p=>({...p, [id]: {...p[id], editMode:false}}))} style={{padding:"4px 8px", background:"transparent", color:C.muted, border:"none", cursor:"pointer", fontSize:11}}>Avbryt</button>
                             </div>
                          ) : (
                             <a href={displayUrl} target="_blank" rel="noopener noreferrer" style={{color:C.green,fontSize:12,wordBreak:"break-all",fontFamily:C.mono,fontWeight:500}} title="Klicka för att öppna denna ögonblicksbild">{displayUrl}</a>
                          )}

                        </div>
                        <CopyButton text={displayUrl} label="Kopiera ny URL" variant="green"/>
                      </div>
                      {displayDate&&(
                        <div style={{marginTop:8,paddingTop:8,borderTop:`1px solid ${C.greenBorder}`,display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:6}}>
                          <div>
                            <span style={{fontSize:10,color:C.green,fontWeight:600,textTransform:"uppercase",letterSpacing:"0.04em"}}>Arkivdatum → </span>
                            <code style={{fontSize:12,color:C.green,fontFamily:C.mono,fontWeight:600,background:"rgba(46,125,91,0.1)",padding:"2px 6px",borderRadius:4}}>{displayDate}</code>
                            <span style={{fontSize:10,color:C.muted,marginLeft:6}}>Kommer att mappas till <code style={{fontSize:10,fontFamily:C.mono}}>|arkivdatum=</code></span>
                          </div>
                          <CopyButton text={displayDate} label="Kopiera datum" variant="green"/>
                        </div>
                      )}
                      {isVerified && (
                        <div style={{marginTop:8,paddingTop:8,borderTop:`1px solid ${C.greenBorder}`}}>
                          <button onClick={()=>{
                            const st = linkStates[id] || {};
                            const singleLink = [{
                              ...lk,
                              waybackUrl: st.customUrl || lk.waybackUrl,
                              waybackDate: st.customUrl ? st.customDate : lk.waybackDate
                            }];
                            executeMassEdit(art.title, art.wikitext, singleLink);
                          }}
                            onMouseEnter={e=>e.currentTarget.style.background=C.accentHover}
                            onMouseLeave={e=>e.currentTarget.style.background=C.accent}
                            style={{display:"inline-flex",alignItems:"center",gap:6,padding:"6px 12px",borderRadius:C.radiusSm,border:"none",background:C.accent,color:"#fff",fontSize:11,fontWeight:600,cursor:"pointer",fontFamily:C.sans}}>
                            <EditIcon/> Åtgärda denna länk på Wikipedia
                          </button>
                        </div>
                      )}
                    </div>
                  )}
                </div>
              )})}
            </div>
          )}
        </div>
      ))}
    </div>
  );
}

/* ── Tabs ── */
function ArticleTab(){
  const[input,setInput]=useState("");const engine=useScanEngine();
  const go=()=>{if(input.trim())engine.scanArticles([input.trim()])};
  return(
    <React.Fragment>
      <AutocompleteInput placeholder="Sök efter en Wikipedia‑artikel…" value={input} onChange={setInput} onGo={go} loading={engine.loading} onStop={engine.stop} searchFn={searchArticles}/>
      {engine.progress&&<Spinner text={engine.progress}/>}{engine.error&&<ErrorMsg msg={engine.error}/>}
      <ResultsView results={engine.results} done={engine.done}/>
    </React.Fragment>
  );
}

function CategoryTab(){
  const[input,setInput]=useState("");const engine=useScanEngine();const[subDepth,setSubDepth]=useState(0);const[gatherMsg,setGatherMsg]=useState("");
  const[catError,setCatError]=useState("");
  const go=async()=>{if(!input.trim())return;engine.reset();setGatherMsg("");setCatError("");try{const seen=new Set();const cat=input.trim();
    let cats=[cat];
    if(subDepth>0){setGatherMsg("Hämtar underkategorier…");cats=await fetchSubcategories(cat,subDepth,msg=>setGatherMsg(msg));setGatherMsg(`Hittade ${cats.length} kategorier. Skannar…`)}
    let totalScanned=0;for(let i=0;i<cats.length&&totalScanned<500;i++){if(i>0)await new Promise(r=>setTimeout(r,500));setGatherMsg(`Kategori ${i+1}/${cats.length}: ${cats[i].replace("Kategori:","").replace("Category:","")}`);const members=await fetchCatMembers(cats[i],Math.min(50,500-totalScanned));const batch=members.filter(t=>!seen.has(t));batch.forEach(t=>seen.add(t));if(batch.length){setGatherMsg("");await engine.scanArticles(batch,{append:totalScanned>0});totalScanned+=batch.length}}}catch(e){setCatError(e.message||"Ett fel uppstod")}finally{setGatherMsg("")}};
  return(
    <React.Fragment>
      <AutocompleteInput placeholder="Sök efter en Wikipedia‑kategori…" value={input} onChange={setInput} onGo={go} loading={engine.loading} onStop={engine.stop} searchFn={searchCategories}/>
      <div style={{display:"flex",alignItems:"center",gap:10,margin:"10px 0 14px",flexWrap:"wrap"}}>
        <span style={{fontSize:13,color:C.textSec,fontWeight:600}}>Inkludera underkategorier:</span>
        {[{v:0,l:"Inga"},{v:1,l:"1 nivå"},{v:2,l:"2 nivåer"},{v:3,l:"3 nivåer"}].map(o=>(
          <button key={o.v} onClick={()=>setSubDepth(o.v)} style={{padding:"5px 12px",borderRadius:C.radiusSm,border:`1px solid ${subDepth===o.v?C.accent:C.cardBorder}`,background:subDepth===o.v?C.accent:C.card,color:subDepth===o.v?"#FAF9F5":C.textSec,fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:C.sans}}>{o.l}</button>
        ))}
      </div>
      {gatherMsg&&<Spinner text={gatherMsg}/>}{engine.progress&&<Spinner text={engine.progress}/>}{engine.error&&<ErrorMsg msg={engine.error}/>}{catError&&<ErrorMsg msg={catError}/>}
      <ResultsView results={engine.results} done={engine.done}/>
    </React.Fragment>
  );
}

function TopicTab(){
  const[selectedTopic,setSelectedTopic]=useState(null);const[customCats,setCustomCats]=useState("");const[phase,setPhase]=useState("pick");const[gatherProgress,setGatherProgress]=useState("");const engine=useScanEngine();

  function pickRandomCats(allCats, count) {
    const shuffled = [...allCats];
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    return shuffled.slice(0, Math.min(count, shuffled.length));
  }

  const startScan=async(allCats)=>{engine.reset();setPhase("scanning");setGatherProgress("Startar skanning…");
    try{const seen=new Set();let totalScanned=0;
      const cats=pickRandomCats(allCats,Math.min(8,allCats.length));
      for(let i=0;i<cats.length&&totalScanned<500;i++){if(i>0)await new Promise(r=>setTimeout(r,500));setGatherProgress(`Kategori ${i+1}/${cats.length}: ${cats[i].replace("Kategori:","").replace("Category:","")}`);const members=await fetchCatMembers(cats[i],Math.min(50,500-totalScanned));const batch=members.filter(t=>!seen.has(t));batch.forEach(t=>seen.add(t));if(batch.length){setGatherProgress("");await engine.scanArticles(batch,{append:totalScanned>0});totalScanned+=batch.length}}
      setGatherProgress("");setPhase("scanning")}catch(e){setGatherProgress("");setPhase("pick")}};
  const handleTopicSelect=t=>{setSelectedTopic(t);startScan(t.cats)};
  const handleCustom=()=>{const cats=customCats.split("\n").map(s=>s.trim()).filter(Boolean).map(c=>c.startsWith("Category:")?c.replace("Category:", "Kategori:"):c.startsWith("Kategori:")?c:`Kategori:${c}`);if(!cats.length)return;setSelectedTopic({id:"custom",label:"Anpassad",icon:`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>`,cats});startScan(cats)};
  const backToPick=()=>{engine.stop();engine.reset();setSelectedTopic(null);setPhase("pick");setGatherProgress("")};

  if(phase==="pick")return(
    <div>
      <div style={{marginBottom:16}}><h3 style={{fontSize:17,fontWeight:700,color:C.text,margin:"0 0 6px",fontFamily:C.serif}}>Välj ett ämnesområde</h3><p style={{fontSize:13,color:C.muted,margin:0,lineHeight:1.5}}>Välj ett fördefinierat ämne eller definiera egna kategorier nedan.</p></div>
      <div style={{background:C.amberSoft,border:`1px solid ${C.amberBorder}`,borderRadius:C.radiusSm,padding:"12px 16px",marginBottom:20,display:"flex",alignItems:"center",gap:10}}>
        <span style={{fontSize:20,lineHeight:1,flexShrink:0}}>📋</span>
        <div><span style={{fontWeight:700,fontSize:13,color:C.amber}}>Skannar 500 artiklar per omgång.</span><span style={{fontSize:12,color:C.textSec,marginLeft:4}}>Om färre än 5 berörda artiklar hittas fortsätter skanningen automatiskt med en ny uppsättning artiklar (upp till 10 omgångar). Artiklarna slumpas vid varje körning.</span></div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill, minmax(155px, 1fr))",gap:10,marginBottom:28}}>
        {TOPICS.map(t=>(
          <button key={t.id} onClick={()=>handleTopicSelect(t)} onMouseEnter={e=>{e.currentTarget.style.borderColor=C.accent;e.currentTarget.style.boxShadow=C.shadowMd}} onMouseLeave={e=>{e.currentTarget.style.borderColor=C.cardBorder;e.currentTarget.style.boxShadow=C.shadow}}
            style={{background:C.card,border:`1px solid ${C.cardBorder}`,borderRadius:C.radius,padding:"18px 14px",cursor:"pointer",textAlign:"left",color:C.text,fontFamily:C.sans,boxShadow:C.shadow}}>
            <div style={{marginBottom:8,color:C.accent}} dangerouslySetInnerHTML={{__html:t.icon}}/><div style={{fontSize:14,fontWeight:600}}>{t.label}</div><div style={{fontSize:11,color:C.mutedLight,marginTop:4}}>{t.cats.length} kategorier</div>
          </button>))}
      </div>
      <div style={{background:C.card,borderRadius:C.radius,padding:22,border:`1px solid ${C.cardBorder}`,boxShadow:C.shadow}}>
        <h4 style={{margin:"0 0 6px",fontSize:15,fontWeight:700,color:C.text,fontFamily:C.serif}}>Anpassade kategorier</h4>
        <p style={{fontSize:12,color:C.muted,margin:"0 0 14px",lineHeight:1.5}}>Ange en Wikipedia‑kategori per rad (upp till totalt 500 artiklar).</p>
        <textarea value={customCats} onChange={e=>setCustomCats(e.target.value)} placeholder={"Kategori:Klimatförändringar\nKategori:Förnybar energi\nKategori:Solenergi"} rows={4} style={{width:"100%",boxSizing:"border-box",padding:"12px 14px",borderRadius:C.radiusSm,border:`1px solid ${C.cardBorder}`,background:C.bg,color:C.text,fontSize:13,fontFamily:C.mono,resize:"vertical"}}/>
        <button onClick={handleCustom} disabled={!customCats.trim()} onMouseEnter={e=>{if(customCats.trim())e.currentTarget.style.background=C.btnDarkHover}} onMouseLeave={e=>{e.currentTarget.style.background=C.btnDark}}
          style={{marginTop:12,padding:"10px 24px",borderRadius:C.radiusSm,border:"none",background:C.btnDark,color:"#FAF9F5",fontSize:13,fontWeight:600,cursor:"pointer",fontFamily:C.sans,opacity:customCats.trim()?1:0.35}}>Skanna egna kategorier</button>
      </div>
    </div>
  );

  return(
    <div>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:18,flexWrap:"wrap",gap:10}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <button onClick={backToPick} onMouseEnter={e=>e.currentTarget.style.borderColor=C.accent} onMouseLeave={e=>e.currentTarget.style.borderColor=C.cardBorder}
            style={{padding:"7px 16px",borderRadius:C.radiusSm,border:`1px solid ${C.cardBorder}`,background:C.card,color:C.muted,fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:C.sans,boxShadow:C.shadow}}>← Tillbaka</button>
          {selectedTopic&&<span style={{display:"inline-flex",alignItems:"center",gap:8,fontSize:15,fontWeight:700,color:C.text,fontFamily:C.serif}}><span style={{color:C.accent}} dangerouslySetInnerHTML={{__html:selectedTopic.icon}}/>{selectedTopic.label}</span>}
          {engine.results.length>0&&<span style={{fontSize:11,color:C.muted,background:C.bgAlt,padding:"4px 10px",borderRadius:"999px",border:`1px solid ${C.cardBorder}`,fontWeight:600}}>{engine.results.length} skannade</span>}
        </div>
        {engine.loading&&<button onClick={()=>{engine.stop();setPhase("scanning")}} style={{padding:"7px 16px",borderRadius:C.radiusSm,border:"none",background:C.red,color:"#fff",fontSize:12,fontWeight:600,cursor:"pointer"}}>Stoppa skanning</button>}
      </div>
      {gatherProgress&&<Spinner text={gatherProgress}/>}{engine.progress&&<Spinner text={engine.progress}/>}{engine.error&&<ErrorMsg msg={engine.error}/>}
      <ResultsView results={engine.results} done={engine.done} showOnlyAffected={true}/>
    </div>
  );
}

/* ── High Traffic Tab ── */
function HighTrafficTab() {
  const engine = useScanEngine();

  const now = new Date();
  const defaultYear = now.getMonth() === 0 ? now.getFullYear() - 1 : now.getFullYear();
  const defaultMonth = now.getMonth() === 0 ? 12 : now.getMonth();
  const maxYear = defaultYear;
  const maxMonth = defaultMonth;

  const [year, setYear] = useState(defaultYear);
  const [month, setMonth] = useState(defaultMonth);
  const [phase, setPhase] = useState('pick');
  const [topPages, setTopPages] = useState([]);
  const [fetchError, setFetchError] = useState(null);
  const [fetchProgress, setFetchProgress] = useState('');

  const monthNames = [
    'Januari','Februari','Mars','April','Maj','Juni',
    'Juli','Augusti','September','Oktober','November','December'
  ];

  const startScan = async () => {
    setFetchError(null);
    setPhase('fetching');
    setFetchProgress('Hämtar mest visade sidor från Wikimedia Pageviews API…');
    engine.reset();

    try {
      const pages = await fetchTopPages(year, month);
      setTopPages(pages);

      if (pages.length === 0) {
        setFetchError('Inga sidor returnerades från API:et för denna månad.');
        setPhase('pick');
        return;
      }

      setFetchProgress('');
      setPhase('scanning');

      const titles = pages.map(p => p.title);
      const BATCH_SIZE = 500;

      for (let i = 0; i < titles.length; i += BATCH_SIZE) {
        const batch = titles.slice(i, i + BATCH_SIZE);
        await engine.scanArticles(batch, { append: i > 0 });
      }
    } catch (err) {
      setFetchError(err.message || 'Det gick inte att hämta toppsidorna.');
      setPhase('pick');
    }
  };

  const backToPick = () => {
    engine.stop();
    engine.reset();
    setTopPages([]);
    setPhase('pick');
    setFetchProgress('');
    setFetchError(null);
  };

  const currentYear = new Date().getFullYear();
  const yearOptions = [];
  for (let y = currentYear; y >= 2015; y--) {
    yearOptions.push(y);
  }

  if (phase === 'pick') {
    return (
      <div>
        <div style={{ marginBottom: 16 }}>
          <h3 style={{ fontSize: 17, fontWeight: 700, color: C.text, margin: '0 0 6px', fontFamily: C.serif }}>
            Skanna sidor med hög trafik
          </h3>
          <p style={{ color: C.muted, fontSize: 13, margin: 0, lineHeight: 1.55 }}>
            Hämtar de mest visade Wikipedia‑artiklarna för en given månad från
            {' '}<a href="https://doc.wikimedia.org/generated-data-platform/aqs/analytics-api/reference/page-views.html"
                    target="_blank" rel="noopener noreferrer"
                    style={{ color: C.accent, textDecoration: 'none', fontWeight: 600 }}>
              Wikimedia Pageviews API
            </a>, och skannar dem sedan efter archive.today‑länkar.
          </p>
        </div>

        <div style={{
          background: C.card,
          borderRadius: C.radius,
          padding: 22,
          border: `1px solid ${C.cardBorder}`,
          boxShadow: C.shadow
        }}>
          <div style={{ display: 'flex', gap: 12, alignItems: 'flex-end', flexWrap: 'wrap' }}>
            <div>
              <label style={{ display: 'block', fontSize: 11, fontWeight: 600, color: C.muted, marginBottom: 4, textTransform: 'uppercase', letterSpacing: '0.04em' }}>
                Månad
              </label>
              <select
                value={month}
                onChange={e => setMonth(Number(e.target.value))}
                style={{
                  padding: '8px 12px', borderRadius: C.radiusSm,
                  border: `1px solid ${C.cardBorder}`, background: C.bg,
                  fontSize: 13, fontFamily: C.sans, color: C.text, cursor: 'pointer'
                }}>
                {monthNames.map((name, i) => {
                  const m = i + 1;
                  const disabled = year === maxYear && m > maxMonth;
                  return <option key={m} value={m} disabled={disabled}>{name}{disabled ? ' (ej tillgänglig än)' : ''}</option>
                })}
              </select>
            </div>

            <div>
              <label style={{ display: 'block', fontSize: 11, fontWeight: 600, color: C.muted, marginBottom: 4, textTransform: 'uppercase', letterSpacing: '0.04em' }}>
                År
              </label>
              <select
                value={year}
                onChange={e => {const y=Number(e.target.value);setYear(y);if(y===maxYear&&month>maxMonth)setMonth(maxMonth)}}
                style={{
                  padding: '8px 12px', borderRadius: C.radiusSm,
                  border: `1px solid ${C.cardBorder}`, background: C.bg,
                  fontSize: 13, fontFamily: C.sans, color: C.text, cursor: 'pointer'
                }}>
                {yearOptions.map(y => (
                  <option key={y} value={y}>{y}</option>
                ))}
              </select>
            </div>

            <button
              onClick={startScan}
              onMouseEnter={e => e.currentTarget.style.background = C.accentHover}
              onMouseLeave={e => e.currentTarget.style.background = C.accent}
              style={{
                padding: '8px 20px', borderRadius: C.radiusSm,
                border: 'none', background: C.accent, color: '#fff',
                fontSize: 13, fontWeight: 600, cursor: 'pointer',
                fontFamily: C.sans, boxShadow: C.shadow
              }}>
              Skanna toppsidor
            </button>
          </div>

          {fetchError && <ErrorMsg msg={fetchError} />}
        </div>
      </div>
    );
  }

  return (
    <div>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 16, flexWrap: 'wrap', gap: 8 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <button
            onClick={backToPick}
            onMouseEnter={e => e.currentTarget.style.borderColor = C.accent}
            onMouseLeave={e => e.currentTarget.style.borderColor = C.cardBorder}
            style={{
              padding: '7px 16px', borderRadius: C.radiusSm,
              border: `1px solid ${C.cardBorder}`, background: C.card,
              color: C.muted, fontSize: 12, fontWeight: 600,
              cursor: 'pointer', fontFamily: C.sans, boxShadow: C.shadow
            }}>
            ← Tillbaka
          </button>
          <span style={{ fontSize: 15, fontWeight: 700, color: C.text, fontFamily: C.serif }}>
            📈 Toppsidor — {monthNames[month - 1]} {year}
          </span>
          {topPages.length > 0 && (
            <span style={{
              fontSize: 11, color: C.muted, background: C.bgAlt,
              padding: '4px 10px', borderRadius: '999px',
              border: `1px solid ${C.cardBorder}`, fontWeight: 600
            }}>
              {topPages.length} sidor hämtade
            </span>
          )}
        </div>
        {engine.loading && (
          <button
            onClick={() => { engine.stop(); setPhase('scanning'); }}
            style={{
              padding: '7px 16px', borderRadius: C.radiusSm,
              border: 'none', background: C.red, color: '#fff',
              fontSize: 12, fontWeight: 600, cursor: 'pointer'
            }}>
            Stoppa skanning
          </button>
        )}
      </div>

      {fetchProgress && <Spinner text={fetchProgress} />}
      {engine.progress && <Spinner text={engine.progress} />}
      {engine.error && <ErrorMsg msg={engine.error} />}
      <ResultsView results={engine.results} done={engine.done} showOnlyAffected={true} />
    </div>
  );
}

/* ── Main App ── */

  const[tab,setTab]=useState("article");
  return(
    <div style={{minHeight:"100vh",background:C.bg,color:C.text,fontFamily:C.sans}}>
      <header style={{borderBottom:`1px solid ${C.cardBorder}`,padding:"28px 20px 0",textAlign:"center",background:C.card}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:8,marginBottom:8}}>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 2L12 22M2 12H22M4.93 4.93L19.07 19.07M19.07 4.93L4.93 19.07" stroke="#D97757" strokeWidth="2.5" strokeLinecap="round"/></svg>
          <span style={{fontSize:12,color:C.accent,letterSpacing:"0.08em",textTransform:"uppercase",fontWeight:700}}>Wikipedia‑referensgranskning</span>
        </div>

        <p style={{color:C.muted,fontSize:13,maxWidth:580,margin:"0 auto 20px",lineHeight:1.55}}>Upptäck archive.today‑referenser på svenska Wikipedia, hitta ersättningar i Wayback Machine och åtgärda dem direkt.</p>
        <div style={{display:"flex",justifyContent:"center",gap:0,borderTop:`1px solid ${C.cardBorder}`,margin:"0 -20px",padding:"0 20px"}}>
          <TabBtn active={tab==="article"} onClick={()=>setTab("article")}>Artikel</TabBtn>
          <TabBtn active={tab==="category"} onClick={()=>setTab("category")}>Kategori</TabBtn>
          <TabBtn active={tab==="topic"} onClick={()=>setTab("topic")}>Ämnesbläddring</TabBtn>
          <TabBtn active={tab==="hightraffic"} onClick={()=>setTab("hightraffic")}>Hög trafik</TabBtn>
        </div>
      </header>
      <main style={{maxWidth:880,margin:"0 auto",padding:"24px 20px 48px"}}>{tab==="article"&&<ArticleTab/>}{tab==="category"&&<CategoryTab/>}{tab==="topic"&&<TopicTab/>}{tab==="hightraffic"&&<HighTrafficTab/>}</main>
      <footer style={{maxWidth:880,margin:"0 auto",padding:"0 20px 32px"}}>
        <div style={{padding:"16px 20px",background:C.bgAlt,borderRadius:C.radius,border:`1px solid ${C.cardBorder}`,fontSize:12,color:C.muted,lineHeight:1.8}}>
          <strong style={{color:C.textSec}}>Upptäckta domäner:</strong> {AT_DOMAINS.join(", ")}<br/>
          <strong style={{color:C.textSec}}>Hur det fungerar:</strong> Hämtar wikitext → regex‑matchar archive.today‑URL:er → extraherar original‑URL:er → frågar Wayback Machine‑API:t → ger redigeringslänkar med ett klick.<br/>
          <strong style={{color:C.textSec}}>Begränsningar:</strong> Upp till 500 artiklar per skanning. Wayback‑kontroller är hastighetsbegränsade (~300 ms mellan förfrågningar). Misslyckade förfrågningar återförsöks automatiskt med ökande väntetid.
        </div>
        <div style={{textAlign:"center",marginTop:16,fontSize:12,color:C.mutedLight}}>
          Original skapat av <a href="https://github.com/nethahussain" target="_blank" rel="noopener noreferrer" style={{color:C.accent,textDecoration:"none",fontWeight:600}} onMouseEnter={e=>e.currentTarget.style.textDecoration="underline"} onMouseLeave={e=>e.currentTarget.style.textDecoration="none"}>Netha Hussain</a> med Claude AI · <a href="https://github.com/nethahussain/wikipedia-archive-today-detector" target="_blank" rel="noopener noreferrer" style={{color:C.accent,textDecoration:"none",fontWeight:600}} onMouseEnter={e=>e.currentTarget.style.textDecoration="underline"} onMouseLeave={e=>e.currentTarget.style.textDecoration="none"}>Källkod</a> · Anpassad för svenska Wikipedia av <a href="https://github.com/DarthCalvinus" target="_blank" rel="noopener noreferrer" style={{color:C.accent,textDecoration:"none",fontWeight:600}} onMouseEnter={e=>e.currentTarget.style.textDecoration="underline"} onMouseLeave={e=>e.currentTarget.style.textDecoration="none"}>DarthCalvinus (Grilledcheeseisgreat)</a> · <a href="https://github.com/DarthCalvinus/swedish-wikipedia-archive-today-detector" target="_blank" rel="noopener noreferrer" style={{color:C.accent,textDecoration:"none",fontWeight:600}} onMouseEnter={e=>e.currentTarget.style.textDecoration="underline"} onMouseLeave={e=>e.currentTarget.style.textDecoration="none"}>Källkod</a>

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
